name: Build offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile-offline/**"
      - "src/components/ninety/**"
      - "src/game/**"
      - "src/styles.css"
      - "vite.mobile.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/build-offline-apk.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core @capacitor/cli @capacitor/android

      - name: Build offline web app
        run: npx vite build --config vite.mobile.config.ts

      - name: Generate Android project
        run: npx cap add android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FC26-Mobile-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
